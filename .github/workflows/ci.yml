name: CI

# Local/GitHub CI. Production CD also via Catalyst Pipelines (catalyst.txt #26).

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check backend etl tests

      - name: Black
        run: uv run black --check backend etl tests

      - name: isort
        run: uv run isort --check-only backend etl tests

      - name: MyPy
        run: uv run mypy backend/app etl

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
