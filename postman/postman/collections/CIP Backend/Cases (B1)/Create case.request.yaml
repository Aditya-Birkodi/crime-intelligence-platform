$kind: http-request
description: Create FIR. crime_no must be 18 chars and unique.
url: "{{baseUrl}}/api/v1/cases"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "crime_no": "104430006202600099",
      "case_no": "202600099",
      "crime_registered_date": "2026-03-01",
      "police_station_id": 6,
      "case_category_id": 1,
      "case_status_id": 1,
      "crime_major_head_id": 1,
      "latitude": "12.971600",
      "longitude": "77.594600",
      "brief_facts": "Postman sample theft FIR",
      "victims": [
        { "victim_name": "Test Victim", "gender_id": "M", "age_year": 30 }
      ],
      "accused": [
        { "accused_name": "Test Accused", "person_id": "A99", "gender_id": "M" }
      ],
      "act_sections": [
        { "act_id": "IPC", "section_id": "379", "act_order_id": 1, "section_order_id": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        const body = pm.response.json();
        pm.collectionVariables.set('caseMasterId', String(body.case_master_id));
      }
    language: text/javascript
order: 3000
